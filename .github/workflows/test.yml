name: Testsuite

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Actions are pinned to commit SHAs, since tags can be moved. setup-uv
    # publishes no major-version tags since v8, so bump these by hand.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # `uv run` puts the dev dependencies (ruff) on PATH for the lint session.
      - name: Run nox with uv
        run: uv run nox

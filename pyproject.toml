[project]
name = "pip-check"
version = "3.3"
description = "Display installed pip packages and their update status."
# Kept low on purpose: people on old Pythons need pip-check to upgrade.
requires-python = ">=3.8"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Martin Mahner", email = "martin@mahner.org" }
]
keywords = ["pip", "uv", "packages", "outdated", "upgrade", "dependencies"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Keep in sync with python_versions in noxfile.py.
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]
dependencies = [
    "packaging>=20.0",  # Version.major
    "terminaltables>=3.1",
]

[dependency-groups]
dev = [
    "nox>=2022.1.7",
    "ruff>=0.11.5",
]

[project.urls]
Homepage = "https://github.com/bartTC/pip-check/"
Issues = "https://github.com/bartTC/pip-check/issues"
Changelog = "https://github.com/bartTC/pip-check/blob/main/CHANGELOG.md"

[project.scripts]
pip-check = "pip_check:main"

[build-system]
# hatchling 1.27 added support for the PEP 639 `license` and `license-files` fields.
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# README.md and CHANGELOG.md are needed to build the wheel from the sdist.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/noxfile.py",
]

# The PyPI description is README.md followed by CHANGELOG.md, so changelog
# entries show up on PyPI too.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "CHANGELOG.md"

# Avoid TOML dotted keys (`lint.select = ...`) anywhere in this file: pip < 19.3
# can't parse them and fails to build the sdist on old Python setups.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",     # No blank line before cclass
  "D212",     # Multi-line summary first line
  "E501",     # Line too long (>88)
  "COM812",   # (ruff format) Checks for the absence of trailing commas
  "ISC001",   # (ruff format) Checks for implicitly concatenated strings on a single line
]

[tool.ruff.lint.extend-per-file-ignores]
"noxfile.py" = [
  "S101",    # Use of assert detected
]
